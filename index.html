<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="description" content="じゃんかね（ROAD TO RICH） - 麻雀成績・精算管理システム" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="じゃんかね" />
    <title>じゃんかね | Road to Rich</title>
    <script>
      // 季節ごとのアクセントカラーを、CSS/JS 読み込み前にちらつきなく適用するための
      // 同期スクリプト。パレットの値は src/lib/seasonalTheme.ts と同じ内容を複製しているので、
      // 配色を変える場合は両方を更新すること。
      (function () {
        var month = new Date().getMonth() + 1;
        var season =
          month >= 3 && month <= 5 ? 'spring' : month >= 6 && month <= 8 ? 'summer' : month >= 9 && month <= 11 ? 'autumn' : 'winter';
        var palettes = {
          spring: {
            scale: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
              950: '#500724',
            },
            rgb500: '236 72 153',
            rgb400: '244 114 182',
            rgb300: '249 168 212',
          },
          summer: {
            scale: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554',
            },
            rgb500: '59 130 246',
            rgb400: '96 165 250',
            rgb300: '147 197 253',
          },
          autumn: {
            scale: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
              950: '#431407',
            },
            rgb500: '249 115 22',
            rgb400: '251 146 60',
            rgb300: '253 186 116',
          },
          winter: {
            scale: {
              50: '#ffffff',
              100: '#f8fafc',
              200: '#eef2f6',
              300: '#dde5ec',
              400: '#c3d0dc',
              500: '#a8b8c7',
              600: '#8a9bac',
              700: '#6b7d8f',
              800: '#4f5f70',
              900: '#374553',
              950: '#1f2933',
            },
            rgb500: '168 184 199',
            rgb400: '195 208 220',
            rgb300: '221 229 236',
          },
        };
        var palette = palettes[season];
        var root = document.documentElement.style;
        for (var step in palette.scale) {
          root.setProperty('--color-cyan-' + step, palette.scale[step]);
          root.setProperty('--color-blue-' + step, palette.scale[step]);
        }
        root.setProperty('--accent-rgb-500', palette.rgb500);
        root.setProperty('--accent-rgb-400', palette.rgb400);
        root.setProperty('--accent-rgb-300', palette.rgb300);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=JetBrains+Mono:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Mochiy+Pop+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

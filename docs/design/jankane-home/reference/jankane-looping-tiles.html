<div id="jankane-focused-tiles" role="region" aria-label="1つのメニューに1枚の麻雀牌が連動する、じゃんかねのホーム">
  <style>
    #jankane-focused-tiles{--jk-bg:#090d10;--jk-ink:#f3f0e7;--jk-muted:#a7aeab;--jk-gold:#cdb780;--jk-line:rgba(223,215,191,.16);position:relative;isolation:isolate;width:100%;overflow:hidden;border-radius:20px;background:var(--jk-bg);color:var(--jk-ink);font-family:"Helvetica Neue","Noto Sans JP","Yu Gothic",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;color-scheme:dark;}
    #jankane-focused-tiles *{box-sizing:border-box;}
    #jankane-focused-tiles button{font:inherit;color:inherit;}
    #jankane-focused-tiles h2,#jankane-focused-tiles p{font-family:inherit;}
    #jankane-focused-tiles .jk-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 73% 36%,rgba(180,162,113,.11),transparent 48%);}
    #jankane-focused-tiles .jk-header{position:relative;z-index:5;display:flex;align-items:center;gap:19px;min-height:80px;padding:26px 34px 0;}
    #jankane-focused-tiles .jk-brand{font-size:21px;font-weight:700;letter-spacing:.02em;line-height:1.2;}
    #jankane-focused-tiles .jk-brand-en{font-size:11px;font-weight:500;letter-spacing:.18em;margin-top:5px;color:var(--jk-gold);}
    #jankane-focused-tiles .jk-header-line{width:1px;height:28px;background:var(--jk-line);}
    #jankane-focused-tiles .jk-home-label{font-size:11px;letter-spacing:.18em;color:#9da5a1;}
    #jankane-focused-tiles .jk-stage{position:relative;height:438px;touch-action:pan-y;cursor:grab;}
    #jankane-focused-tiles .jk-stage.jk-dragging{cursor:grabbing;}
    #jankane-focused-tiles .jk-webgl,#jankane-focused-tiles .jk-fallback{position:absolute;inset:0;pointer-events:none;}
    #jankane-focused-tiles .jk-webgl canvas{display:block;width:100%;height:100%;}
    #jankane-focused-tiles .jk-fallback{perspective:1100px;}
    #jankane-focused-tiles .jk-fallback-tile{position:absolute;left:71%;top:48%;width:154px;height:228px;border-radius:12px;background:#efecdf;box-shadow:3px 5px 0 #e2dfd1,7px 10px 0 #c8c9bb,13px 18px 0 #195a42,17px 22px 2px #123c30,24px 34px 28px #0006;transform-style:preserve-3d;}
    #jankane-focused-tiles .jk-fallback-tile canvas{display:block;width:100%;height:100%;border-radius:12px;border:1px solid #ffffff80;}
    #jankane-focused-tiles .jk-fallback-tile::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 2px 3px 4px #fff9,inset -2px -3px 5px #796e5033;}
    #jankane-focused-tiles .jk-copy{position:absolute;inset:0 34px;pointer-events:none;z-index:3;}
    #jankane-focused-tiles .jk-slide{position:absolute;top:137px;left:0;width:55%;will-change:transform,opacity;}
    #jankane-focused-tiles .jk-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--jk-gold);font-size:11px;font-weight:500;letter-spacing:.2em;}
    #jankane-focused-tiles .jk-eyebrow::before{content:"";height:1px;width:26px;background:var(--jk-gold);}
    #jankane-focused-tiles h2{font-size:clamp(38px,6.6vw,62px);font-weight:600;letter-spacing:-.055em;line-height:1.16;margin:0 0 17px;white-space:nowrap;}
    #jankane-focused-tiles [data-jk-slide="2"] h2{font-size:clamp(27px,4.7vw,43px);}
    #jankane-focused-tiles .jk-description{margin:0;font-size:13px;line-height:1.75;letter-spacing:.025em;color:#b0b9b3;}
    #jankane-focused-tiles .jk-selection{position:absolute;bottom:23px;left:34px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.07em;z-index:3;}
    #jankane-focused-tiles .jk-count{color:var(--jk-gold);font-variant-numeric:tabular-nums;letter-spacing:.13em;}
    #jankane-focused-tiles .jk-divider{height:12px;width:1px;background:var(--jk-line);}
    #jankane-focused-tiles .jk-tile-name{color:#a7b1a9;}
    #jankane-focused-tiles .jk-nav-zone{position:relative;z-index:5;margin:0 34px;padding-top:18px;border-top:1px solid var(--jk-line);}
    #jankane-focused-tiles .jk-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
    #jankane-focused-tiles .jk-menu{position:relative;background:transparent;border:0;border-radius:3px;padding:9px 0 10px;min-height:59px;text-align:left;font-size:13px;letter-spacing:.02em;color:#929e97;}
    #jankane-focused-tiles .jk-menu::before{content:"";position:absolute;top:-19px;left:0;width:0;height:2px;background:var(--jk-gold);transition:width .2s ease;}
    #jankane-focused-tiles .jk-menu[aria-pressed="true"]{color:var(--jk-ink);}
    #jankane-focused-tiles .jk-menu[aria-pressed="true"]::before{width:100%;}
    #jankane-focused-tiles .jk-menu-number{display:block;font-size:11px;letter-spacing:.12em;color:#89988c;margin-bottom:7px;font-variant-numeric:tabular-nums;}
    #jankane-focused-tiles .jk-menu[aria-pressed="true"] .jk-menu-number{color:var(--jk-gold);}
    #jankane-focused-tiles .jk-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0 22px;}
    #jankane-focused-tiles .jk-hint{color:#99a69d;font-size:11px;letter-spacing:.02em;line-height:1.6;}
    #jankane-focused-tiles .jk-arrows{display:flex;gap:8px;flex-shrink:0;}
    #jankane-focused-tiles .jk-arrow{display:grid;place-items:center;background:#ffffff04;border:1px solid #c9d0c42e;border-radius:50%;width:40px;height:40px;font-size:19px;}
    #jankane-focused-tiles .jk-arrow:hover:not(:disabled){background:#cdb78018;border-color:#cdb78080;}
    #jankane-focused-tiles .jk-arrow:disabled{opacity:.25;cursor:default;}
    #jankane-focused-tiles .jk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    @media(max-width:560px){
      #jankane-focused-tiles{border-radius:17px;}
      #jankane-focused-tiles .jk-header{min-height:72px;padding:23px 24px 0;gap:15px;}
      #jankane-focused-tiles .jk-brand{font-size:19px;}
      #jankane-focused-tiles .jk-stage{height:466px;}
      #jankane-focused-tiles .jk-copy{inset:0 24px;}
      #jankane-focused-tiles .jk-slide{top:309px;width:100%;}
      #jankane-focused-tiles .jk-eyebrow{margin-bottom:10px;}
      #jankane-focused-tiles h2{font-size:42px;margin-bottom:10px;}
      #jankane-focused-tiles [data-jk-slide="2"] h2{font-size:34px;}
      #jankane-focused-tiles .jk-description{font-size:12px;}
      #jankane-focused-tiles .jk-selection{left:24px;bottom:13px;}
      #jankane-focused-tiles .jk-fallback-tile{left:50%;top:30%;width:139px;height:206px;}
      #jankane-focused-tiles .jk-nav-zone{margin:0 24px;padding-top:17px;}
      #jankane-focused-tiles .jk-nav{grid-template-columns:1fr 1fr 1.6fr minmax(44px,.6fr);gap:7px;}
      #jankane-focused-tiles .jk-menu{font-size:11px;letter-spacing:0;}
      #jankane-focused-tiles .jk-menu::before{top:-18px;}
      #jankane-focused-tiles .jk-footer{padding-top:8px;padding-bottom:20px;}
      #jankane-focused-tiles .jk-hint{max-width:205px;}
      #jankane-focused-tiles .jk-glow{background:radial-gradient(ellipse at 50% 25%,rgba(180,162,113,.12),transparent 45%);}
    }
    @media(max-width:360px){
      #jankane-focused-tiles .jk-header{padding-left:18px;padding-right:18px;}
      #jankane-focused-tiles .jk-copy{left:18px;right:18px;}
      #jankane-focused-tiles .jk-selection{left:18px;}
      #jankane-focused-tiles .jk-nav-zone{margin-left:18px;margin-right:18px;}
      #jankane-focused-tiles [data-jk-slide="2"] h2{font-size:30px;}
      #jankane-focused-tiles .jk-hint{max-width:160px;}
    }
    @media(pointer:coarse){#jankane-focused-tiles .jk-arrow{min-width:44px;min-height:44px;}}
    @media(prefers-reduced-motion:reduce){#jankane-focused-tiles .jk-menu::before{transition:none;}}
  </style>

  <script>
  (() => {
    const root=document.getElementById('jankane-focused-tiles');
    if(!root||root.dataset.jkReady)return;
    root.dataset.jkReady='true';
    const stage=root.querySelector('.jk-stage'),slides=[...root.querySelectorAll('[data-jk-slide]')],buttons=[...root.querySelectorAll('[data-jk-go]')];
    const fallback=root.querySelector('.jk-fallback'),fallbackTiles=[...root.querySelectorAll('[data-jk-tile]')];
    const prev=root.querySelector('[data-jk-prev]'),next=root.querySelector('[data-jk-next]'),live=root.querySelector('[data-jk-live]');
    const names=['順位表','対局入力','ダッシュボード','段位'],tileNames=['赤伍萬','發','七筒','一索'];
    const originalArt=JSON.parse(root.querySelector('#jankane-original-tile-art').textContent);
    const media=window.matchMedia('(prefers-reduced-motion: reduce)');let reduced=media.matches;
    let position=0,target=0,velocity=0,frame=0,lastFrame=0,pointer=null,axis=null,lastPointerX=0,lastPointerTime=0,pointerVelocity=0;
    let renderScene=null,resizeScene=null,disposeScene=null,hoverX=0,hoverY=0,disposed=false;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const count=names.length,mod=(value,n)=>((value%n)+n)%n;
    const menuIndex=value=>mod(Math.round(value),count);
    const signedDistance=(index,p)=>mod(index-p+count/2,count)-count/2;
    const nearestPosition=index=>index+Math.round((position-index)/count)*count;
    root.dataset.jkLoop='true';
    function pose(index,p){
      // A closed orbit keeps all four tiles continuous through the 04 / 01 seam.
      const angle=(index-mod(p,count))*Math.PI*2/count;
      const side=Math.sin(angle),depth=(1-Math.cos(angle))/2;
      const focus=Math.exp(-7.8*depth),light=.025+.975*Math.exp(-5*depth);
      return {x:side*2.18,y:.16+depth*.85,z:.5-depth*4.1,scale:1.2-depth*.46,rx:-.07+depth*.14,ry:.12-side*.21,rz:-.055+side*.105,side,depth,focus,light};
    }
    function paint(){
      slides.forEach((slide,i)=>{const d=signedDistance(i,position);slide.style.opacity=String(clamp(1-Math.abs(d)*1.35,0,1));slide.style.transform='translate3d('+(reduced?0:d*65)+'px,0,0)';slide.style.visibility=Math.abs(d)>1?'hidden':'visible';});
      fallbackTiles.forEach((tile,i)=>{const v=pose(i,position);tile.style.opacity='1';tile.style.zIndex=String(Math.round((1-v.depth)*100));tile.style.filter='brightness('+(Math.pow(v.light,.6))+')';tile.style.transform='translate(-50%,-50%) translate3d('+(v.side*150)+'px,'+(-v.depth*48)+'px,'+(-v.depth*300)+'px) scale('+(1-v.depth*.39)+') rotateX('+(reduced?0:-5+v.depth*8)+'deg) rotateY('+(reduced?0:-16-v.side*18)+'deg) rotateZ('+(reduced?0:-3+v.side*7)+'deg)';});
      if(renderScene)renderScene(position,reduced,hoverX,hoverY);
      root.dataset.jkPosition=String(Math.round(position*1000)/1000);
    }
    function selection(index){
      index=menuIndex(index);
      buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));slides.forEach((s,i)=>s.setAttribute('aria-hidden',String(i!==index)));
      root.querySelector('.jk-count').textContent='0'+(index+1)+' / 04';root.querySelector('.jk-tile-name').textContent=tileNames[index];
      live.textContent=names[index]+'、'+tileNames[index]+'を選択中。4つ中'+(index+1)+'つ目。';root.dataset.jkSelected=String(index);
    }
    function tick(now){
      frame=0;const dt=Math.min((now-lastFrame)/1000||1/60,1/30);lastFrame=now;
      if(reduced){position=target;velocity=0;paint();return;}
      velocity+=(target-position)*235*dt;velocity*=Math.exp(-25*dt);position+=velocity*dt;
      if(Math.abs(target-position)<.0005&&Math.abs(velocity)<.006){position=target;velocity=0;paint();return;}
      paint();frame=requestAnimationFrame(tick);
    }
    function select(i){target=Math.round(i);root.dataset.jkTarget=String(target);selection(target);if(frame)cancelAnimationFrame(frame);lastFrame=performance.now();frame=requestAnimationFrame(tick);}
    buttons.forEach(b=>b.addEventListener('click',()=>select(nearestPosition(Number(b.dataset.jkGo)))));prev.addEventListener('click',()=>select(target-1));next.addEventListener('click',()=>select(target+1));
    root.addEventListener('keydown',e=>{const keys={ArrowRight:target+1,ArrowLeft:target-1,Home:nearestPosition(0),End:nearestPosition(3)};if(keys[e.key]!==undefined){e.preventDefault();select(keys[e.key]);}});
    stage.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,start:position};axis=null;lastPointerX=e.clientX;lastPointerTime=performance.now();pointerVelocity=0;if(frame){cancelAnimationFrame(frame);frame=0;}});
    stage.addEventListener('pointermove',e=>{
      if(!pointer){if(e.pointerType==='mouse'&&!reduced){const box=stage.getBoundingClientRect();hoverX=clamp((e.clientX-box.left)/box.width-.5,-.5,.5);hoverY=clamp((e.clientY-box.top)/box.height-.5,-.5,.5);paint();}return;}
      if(pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;
      if(!axis&&Math.max(Math.abs(dx),Math.abs(dy))>7){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(axis==='x'){stage.setPointerCapture(e.pointerId);stage.classList.add('jk-dragging');}}
      if(axis!=='x')return;
      const distance=Math.max(175,stage.clientWidth*.44);position=pointer.start-dx/distance;
      const now=performance.now(),v=-(e.clientX-lastPointerX)/Math.max(12,now-lastPointerTime)*1000/distance;pointerVelocity=pointerVelocity*.45+v*.55;lastPointerX=e.clientX;lastPointerTime=now;paint();
    });
    function release(e){if(!pointer||pointer.id!==e.pointerId)return;const horizontal=axis==='x';pointer=null;stage.classList.remove('jk-dragging');if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);if(horizontal){const v=performance.now()-lastPointerTime<110?pointerVelocity:0;velocity=clamp(v,-5,5);select(Math.round(position+clamp(v*.13,-.6,.6)));}else select(target);axis=null;}
    stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',e=>{pointerVelocity=0;release(e);});
    stage.addEventListener('pointerleave',()=>{if(!pointer){hoverX=0;hoverY=0;paint();}});
    media.addEventListener('change',e=>{reduced=e.matches;hoverX=0;hoverY=0;select(target);});
    selection(0);paint();
    const observer=new ResizeObserver(()=>{if(resizeScene)resizeScene();paint();});observer.observe(stage);

    function loadSource(source){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=source;});}
    function makeCanvas(width,height){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;return canvas;}
    function prepareArt(image,kind){
      const source=makeCanvas(image.naturalWidth,image.naturalHeight),ctx=source.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
      const sw=source.width,sh=source.height,sourcePixels=ctx.getImageData(0,0,sw,sh),data=sourcePixels.data;
      const clean=makeCanvas(sw,sh),cleanCtx=clean.getContext('2d'),cleanPixels=cleanCtx.createImageData(sw,sh);
      let minX=sw,minY=sh,maxX=0,maxY=0;
      for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
        const at=(y*sw+x)*4,r=data[at],g=data[at+1],b=data[at+2],alpha=data[at+3]/255;
        const coverage=alpha*(kind==='red'?clamp((r-Math.max(g,b)-10)/60,0,1):clamp(((kind==='bird'?255:245)-Math.min(r,g,b))/48,0,1));
        cleanPixels.data[at]=r;cleanPixels.data[at+1]=g;cleanPixels.data[at+2]=b;cleanPixels.data[at+3]=Math.round(coverage*255);

name: Update in-app changelog

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-in-app-changelog
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add the merged PR to the update history
        run: node scripts/update-changelog.mjs "$GITHUB_EVENT_PATH"

      - name: Commit the generated update
        run: |
          if git diff --quiet -- src/data/generatedUpdates.json; then
            echo "No changelog update was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generatedUpdates.json
          git commit -m "chore: update in-app changelog for PR #${{ github.event.pull_request.number }} [skip ci]"
          git push origin HEAD:main
